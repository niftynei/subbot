alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
databases:
- cluster_name: db-postgresql-nyc1-subbot-03505
  engine: PG
  name: db-postgresql-nyc1-subbot-03505
  production: true
  version: "18"
domains:
- domain: subbot.me
  type: PRIMARY
  zone: subbot.me
ingress:
  rules:
  - component:
      name: subbot
    match:
      authority:
        exact: ""
      path:
        prefix: /
name: subbot-app
region: nyc
services:
- dockerfile_path: Dockerfile
  envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${db-postgresql-nyc1-subbot-03505.DATABASE_URL}
  - key: VITE_GOOGLE_CLIENT_ID
    scope: RUN_AND_BUILD_TIME
    value: 267772693917-o8uf2htk4tbgcrgvrodmotac5rpu903v.apps.googleusercontent.com
  github:
    branch: master
    deploy_on_push: true
    repo: niftynei/subbot
  http_port: 8080
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb
  name: subbot
  source_dir: /
